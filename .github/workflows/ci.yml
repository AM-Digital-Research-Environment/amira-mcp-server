name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs, but let every push to main finish so each main
  # commit keeps a CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a full commit SHA; the trailing comment names the
# release. Dependabot (github-actions ecosystem) bumps both together.

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: "24"
      # Type errors do not depend on the Node runtime, so this runs once here
      # rather than in every unit-test lane. @types/node tracks the declared
      # floor (Node 22), so code cannot typecheck against APIs the floor lacks.
      - run: npm run typecheck
      # Biome, lint rules only (formatting is not enforced); biome.json.
      - run: npm run lint

  test:
    name: Unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest]
        include:
          - node: 24
            os: windows-latest
          # The exact floor manifest.json declares (`>=22.0.0`): the 22 lane
          # runs the newest 22.x, which can hide an API added in a later minor.
          - node: "22.0.0"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ matrix.node }}
      # --strict: an invalid skill fails CI instead of being dropped from the
      # catalog with a warning, which is what a plain local build does.
      - run: npm run build:strict
      - run: node scripts/test.mjs unit
      # bash, not the Windows default pwsh: pwsh exits with the LAST command's
      # code only, so a failing fixture-snapshot was hidden by a passing pack.
      - name: Windows fixture packaging check
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/fixture-snapshot.mjs
          npm run validate:manifest
          node scripts/mcpb.mjs pack . windows-fixture.mcpb
          node scripts/mcpb.mjs list windows-fixture.mcpb
      # The real-bundle allowlist test skips without data/, which the unit run
      # above never has. Run it again now that the fixture snapshot exists;
      # AMIRA_REQUIRE_REAL_BUNDLE turns that skip into a failure.
      - name: Real-bundle allowlist (fixture snapshot)
        if: runner.os == 'Windows'
        shell: bash
        env:
          AMIRA_REQUIRE_REAL_BUNDLE: "1"
        run: node --test test/unit/packaging.test.mjs

  smoke:
    name: Protocol and package smoke tests
    # Only the typecheck: the crawl and smoke chain need not wait for every
    # unit-test lane (the slow Windows one included).
    needs: [typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: "26"
      # The crawl hits the public Omeka API, so CI reuses one per ISO week and
      # per version of the crawl code; a change to it crawls afresh. Release and
      # refresh-data always crawl, so a cached snapshot never ships.
      - name: Snapshot cache key
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore this week's crawled snapshot
        id: data-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: snapshot-${{ steps.week.outputs.week }}-${{ hashFiles('src/snapshot.ts', 'src/transform.ts', 'src/omekaJSON.ts', 'src/types.ts', 'src/semantic.ts', 'src/fulltextMaps.ts') }}
      - run: npm run fetch-data
        if: steps.data-cache.outputs.cache-hit != 'true'
        env:
          # Read-only: lists DRE Visualizations' corpus-vector releases without
          # the anonymous API rate limit (sent to api.github.com only).
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
        if: steps.data-cache.outputs.cache-hit == 'true'
      - name: Real-bundle allowlist (crawled snapshot)
        env:
          AMIRA_REQUIRE_REAL_BUNDLE: "1"
        run: node --test test/unit/packaging.test.mjs
      - run: npm run smoke
      - run: npm run smoke:http
      # Response weight at every tool's maximum limit. Needs the real snapshot,
      # hence this job and not the unit tests, which gate the tool surface.
      - run: npm run weigh -- --check
      - run: npm run validate:manifest
      - run: npm run audit
      # The bundle users install, packed from the snapshot this job crawled,
      # for the installed-bundle job to run on the desktop platforms.
      - name: Pack the bundle
        run: node scripts/mcpb.mjs pack . amira-mcp-server.mcpb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-bundle
          path: amira-mcp-server.mcpb
          if-no-files-found: error
          retention-days: 2

  # Unpack the packed .mcpb on Windows and macOS and run the stdio smoke against
  # the extracted server/index.js and data/: the bytes users install, not the
  # working tree. Catches an .mcpbignore rule that drops a file the server
  # needs, which the archive file list alone cannot. (The IWAC server's
  # desktop-native job, adapted: this bundle has no native bindings.)
  installed-bundle:
    name: Installed bundle (${{ matrix.os }})
    needs: smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-bundle
      - name: Unpack and smoke-test the bundle
        shell: bash
        run: |
          node scripts/mcpb.mjs unpack amira-mcp-server.mcpb "$RUNNER_TEMP/bundle"
          AMIRA_SMOKE_SERVER="$RUNNER_TEMP/bundle/server/index.js" npm run smoke

  container:
    name: Container build and health (offline fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: "24"
      - run: npm run build:strict
      - run: node scripts/fixture-snapshot.mjs
      - run: docker build --build-arg SNAPSHOT_STAGE=bundled -t amira-test .
      - run: |
          docker run -d --name amira-test -p 8787:8787 -e AMIRA_LIVE_REFRESH=0 amira-test
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8787/healthz; then exit 0; fi
            sleep 1
          done
          docker logs amira-test
          exit 1
      - if: always()
        run: docker rm -f amira-test || true

  # Official MCP conformance suite against the Streamable HTTP server, scored
  # against what the 2026-07-28 revision requires. conformance-baseline.yml
  # lists, check by check, the failures that only the suite's reference
  # fixtures could pass. The run fails on any other failure, and on a
  # baselined check that starts passing. The per-scenario checks.json files
  # are uploaded for triage. Still continue-on-error; removing that line
  # makes the job gate.
  # 0.2.0-alpha.12 is pinned on purpose: `latest` (0.1.x) predates 2026-07-28.
  # A new suite version needs a fresh triage, because check ids move.
  conformance:
    name: MCP conformance (2026-07-28, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: "26"
      - run: npm run build:strict
      # Offline fixture snapshot: no Omeka crawl, deterministic data.
      - run: node scripts/fixture-snapshot.mjs
      - name: Start the HTTP server
        env:
          PORT: "8787"
          HOST: 127.0.0.1
          AMIRA_LIVE_REFRESH: "0"
          # The suite fires many requests from one client; the courtesy rate
          # limit would turn that into 429s that say nothing about conformance.
          AMIRA_RATE_LIMIT: "0"
        run: |
          export AMIRA_CACHE_DIR="$RUNNER_TEMP/amira-cache"
          nohup node server/http.js > "$RUNNER_TEMP/amira-http.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8787/healthz; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/amira-http.log"
          exit 1
      - name: Run the conformance suite
        run: >-
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 server
          --url http://127.0.0.1:8787/mcp
          --requirements 2026-07-28
          --expected-failures conformance-baseline.yml
          --output-dir conformance-results
      - name: Collect the server log
        if: always()
        run: |
          mkdir -p conformance-results
          cp "$RUNNER_TEMP/amira-http.log" conformance-results/ 2>/dev/null || true
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: conformance-results/
          if-no-files-found: ignore
          retention-days: 14
