name: Release

# Build a fresh, self-contained .mcpb (snapshot crawled from the public Omeka S
# API) and attach it to a GitHub Release. Triggered by pushing a version tag
# (e.g. `git tag v1.0.0 && git push --tags`); also runs on demand for a build
# sanity check (artifact only, no release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build data snapshot from the public Omeka S API
        run: npm run fetch-data
      - name: Unit tests
        run: npm test
      - name: Live API tests
        run: npm run test:live
      - name: Type-check, bundle, smoke-test
        run: npm run prepack-mcpb
      - name: Pack .mcpb
        run: npx -y @anthropic-ai/mcpb@latest pack . amira-mcp-server.mcpb
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: amira-mcp-server-mcpb
          path: amira-mcp-server.mcpb
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # Uses a PAT/App secret if present, else the default token (which needs
          # org "Read and write" workflow permissions to publish releases).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" amira-mcp-server.mcpb --clobber
          else
            gh release create "${{ github.ref_name }}" amira-mcp-server.mcpb \
              --title "${{ github.ref_name }} — AMIRA MCP server" \
              --generate-notes
          fi
