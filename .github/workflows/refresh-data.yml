name: Refresh data snapshot

# Keeps a downloadable .mcpb in sync with the live Omeka S data.
# Runs on a schedule (and on demand): crawls the public API, and ONLY if the
# data changed since the last published build (max o:modified + per-corpus
# counts — the D11 freshness pair recorded in data/manifest.json), rebuilds,
# re-tests and updates the rolling `data-latest` pre-release. No database or
# VPN involved — it reads the same public JSON any browser can.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  ROLLING_TAG: data-latest
  # Uses a PAT/App secret if present, else the default token (which needs org
  # "Read and write" workflow permissions to publish releases).
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Crawl latest data from the public Omeka S API
        run: npm run fetch-data

      - name: Read snapshot freshness signature
        id: snap
        run: |
          sig=$(node -p "const m=require('./data/manifest.json'); m.maxModified + '|' + JSON.stringify(m.counts)")
          echo "signature=$sig" >> "$GITHUB_OUTPUT"
          printf '%s' "$sig" > snapshot-signature.txt

      - name: Read previously published signature
        id: prev
        run: |
          prev=""
          if gh release download "$ROLLING_TAG" --pattern snapshot-signature.txt --output prev.txt 2>/dev/null; then
            prev=$(cat prev.txt)
          fi
          echo "signature=$prev" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: check
        env:
          CURRENT: ${{ steps.snap.outputs.signature }}
          PREVIOUS: ${{ steps.prev.outputs.signature }}
        run: |
          if [ -n "$PREVIOUS" ] && [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Data unchanged ($CURRENT) — nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New data ($CURRENT, was '$PREVIOUS') — rebuilding."
          fi

      - name: Unit + live API tests
        if: steps.check.outputs.changed == 'true'
        run: |
          npm test
          npm run test:live

      - name: Type-check, bundle, smoke-test, pack
        if: steps.check.outputs.changed == 'true'
        run: |
          npm run prepack-mcpb
          npx -y @anthropic-ai/mcpb@latest pack . amira-mcp-server.mcpb

      - name: Publish / update rolling pre-release
        if: steps.check.outputs.changed == 'true'
        env:
          CURRENT: ${{ steps.snap.outputs.signature }}
        run: |
          notes="Auto-built .mcpb tracking the live Omeka S data (snapshot signature: $CURRENT).

          This rolling pre-release always carries the latest data. For versioned, code-tagged builds see the main Releases list."
          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            gh release upload "$ROLLING_TAG" amira-mcp-server.mcpb snapshot-signature.txt --clobber
            gh release edit "$ROLLING_TAG" --title "Latest data snapshot" --notes "$notes" --prerelease
          else
            gh release create "$ROLLING_TAG" amira-mcp-server.mcpb snapshot-signature.txt \
              --title "Latest data snapshot" --notes "$notes" --prerelease
          fi
