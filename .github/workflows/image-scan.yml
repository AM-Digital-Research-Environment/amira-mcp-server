name: Image scan

# Watches the published container image between releases. Once a week (and on
# demand) Trivy scans ghcr.io/<repo>:latest for high and critical
# vulnerabilities that already have a fix. While any remain, one issue labelled
# `image-vulnerabilities` stays open and assigned to the maintainer, so GitHub
# notifies them: when it opens, and with a comment whenever the findings
# change. A clean scan closes it. The CI container job runs the same scan on
# every fresh build, so a release normally clears the issue.
#
# Least privilege: `scan` pulls the image and runs the third-party scanner with
# a read-only token; only `report`, which runs no third-party code, can write
# issues.
#
# Every action is pinned to a full commit SHA; the trailing comment names the
# release. Dependabot (github-actions ecosystem) bumps both together.

on:
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan the published image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read # pull from ghcr.io
    outputs:
      image: ${{ steps.pull.outputs.image }}
      digest: ${{ steps.pull.outputs.digest }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the latest release image
        id: pull
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pull.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy.json
          retention-days: 30

  report:
    name: Open, update or close the tracking issue
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ASSIGNEE: fmadore
      LABEL: image-vulnerabilities
      IMAGE: ${{ needs.scan.outputs.image }}
      DIGEST: ${{ needs.scan.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-report
      - name: Sync the issue with the findings
        run: |
          set -euo pipefail
          jq -r '[.Results[]? | .Vulnerabilities[]?
                  | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) |"]
                 | unique | .[]' trivy.json > rows.md
          count=$(wc -l < rows.md)
          fingerprint=$(sha256sum rows.md | cut -c1-16)
          issue=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [ "$count" -eq 0 ]; then
            echo "No fixable high or critical vulnerabilities in $IMAGE ($DIGEST)."
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "The [scan of $(date -u +%F)]($run_url) found no fixable high or critical vulnerabilities in \`$IMAGE\` (\`$DIGEST\`). Closing."
            fi
            exit 0
          fi

          title="Published image: $count fixable high/critical vulnerabilities"
          {
            echo "The [scan of $(date -u +%F)]($run_url) found **$count** fixable high or critical vulnerabilities in \`$IMAGE\` (\`$DIGEST\`)."
            echo
            echo "| Severity | Vulnerability | Package | Installed | Fixed in |"
            echo "|---|---|---|---|---|"
            cat rows.md
            echo
            echo "A fresh build of \`main\` applies Debian's security updates and leaves npm out of the runtime image, and CI fails if it still finds any of these. The usual fix is therefore a new release, which republishes the image. If CI does flag them, bump the \`node:26-slim\` digest in the Dockerfile (Dependabot's weekly docker PR does this)."
            echo
            echo "This issue is maintained by \`.github/workflows/image-scan.yml\` and closes itself after a clean scan."
            echo
            echo "<!-- fingerprint: $fingerprint -->"
          } > body.md

          if [ -z "$issue" ]; then
            gh label create "$LABEL" --color B60205 --force \
              --description "Fixable high/critical CVEs in the published container image"
            gh issue create --title "$title" --label "$LABEL" --assignee "$ASSIGNEE" --body-file body.md
            exit 0
          fi

          previous=$(gh issue view "$issue" --json body --jq .body | sed -n 's/.*<!-- fingerprint: \([0-9a-f]*\) -->.*/\1/p')
          if [ "$previous" = "$fingerprint" ]; then
            echo "Issue #$issue already lists these $count findings."
            exit 0
          fi
          gh issue edit "$issue" --title "$title" --body-file body.md --add-assignee "$ASSIGNEE"
          gh issue comment "$issue" --body "The findings changed: the [scan of $(date -u +%F)]($run_url) lists $count fixable high or critical vulnerabilities. The issue description has the updated table."
