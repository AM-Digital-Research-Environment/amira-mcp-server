version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
    ignore:
      # @types/node tracks the supported Node floor (engines ">=22"), not the
      # Node 26 runtime, so typecheck rejects APIs newer than the floor. Raise
      # it by hand together with engines, manifest.json and the CI floor lane.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # Workflows pin every action to a full commit SHA with a `# vX.Y.Z` comment;
  # Dependabot bumps the SHA and the comment together.
  - package-ecosystem: github-actions
    # The workflows, and the composite actions they share.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
  # Both FROM lines in the Dockerfile pin node:26-slim by digest; this keeps
  # the digest current (base-image security fixes) without a floating tag.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
