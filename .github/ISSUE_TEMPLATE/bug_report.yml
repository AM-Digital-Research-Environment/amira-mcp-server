name: Bug report
description: A tool returns something wrong, the server fails to start, or a client cannot connect.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        If a **record** is wrong on the AMIRA site itself, that is a curation
        matter rather than a bug here — see the links on the previous page.

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, or `version` from `manifest.json`.
      placeholder: v1.12.0
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: How are you running it?
      options:
        - Claude Desktop extension (.mcpb)
        - stdio (node server/index.js)
        - HTTP (npm run start:http)
        - Docker
        - Other MCP client
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client and OS
      placeholder: Claude Desktop 0.14 on macOS 15 / ChatGPT connector / custom SDK client

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >-
        Name the tool and the arguments you called it with, then what came back
        versus what you expected. Paste the JSON result if you have it.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server output
      description: >-
        Anything the server wrote to stderr — startup lines, refresh warnings,
        stack traces.
      render: text

  - type: checkboxes
    id: offline
    attributes:
      label: Live refresh
      options:
        - label: I have tried it with live refresh off (bundled snapshot only)
